
{% extends 'base.html' %}

{% block content %}

    <!-- Display the delete confirmation inside a card -->
    <div class="card shirt-card mx-auto mt-4" style="max-width: 600px;">

        <!-- Page heading -->
        <div class="card-header shirt-card-header">
            <h3>Delete Comment</h3>
        </div>

        <div class="card-body p-4">

            <!-- Ask the user to confirm deletion -->
            <p>Are you sure you want to delete this comment?</p>

            <!-- Show the comment before confirming deletion -->
            <div class="shirt-details mb-3">
                <p>{{ comment.content }}</p>
            </div>

            <!-- Submit the deletion request -->
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    Yes, Delete Comment
                </button>

                <a href="{% url 'home' %}" class="btn btn-primary">
                    Cancel
                </a>
            </form>

        </div>
    </div>

{% endblock %}
