
{% extends 'base.html' %}

{% block content %}

    <!-- Display the edit shirt form inside a card -->
    <div class="card shirt-card mx-auto mt-4" style="max-width: 800px;">

        <!-- Page heading -->
        <div class="card-header shirt-card-header">
            <h3>Edit Shirt</h3>
        </div>

        <div class="card-body p-4">

            <!-- Form for updating the shirt details -->
            <form method="POST">
                {% csrf_token %}

                <!-- Display the shirt information fields -->
                {{ form.as_p }}

                <!-- Save the updated shirt details -->
                <button type="submit" class="btn btn-comment">
                    Save Changes
                </button>
            </form>

        </div>
    </div>

{% endblock %}
