
{% extends 'base.html' %}

{% block content %}

    <!-- Display the edit comment form inside a card -->
    <div class="card shirt-card mx-auto mt-4" style="max-width: 600px;">

        <!-- Page heading -->
        <div class="card-header shirt-card-header">
            <h3>Edit Comment</h3>
        </div>

        <div class="card-body p-4">

            <!-- Allow the user to update their comment -->
            <form method="POST">
                {% csrf_token %}

                <!-- Display the comment field -->
                {{ form.as_p }}

                <!-- Save or cancel the changes -->
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{% url 'home' %}" class="btn btn-danger">
                    Cancel
                </a>
            </form>

        </div>
    </div>

{% endblock %}
