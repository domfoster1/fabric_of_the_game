
{% extends 'base.html' %}

{% block content %}

    <!-- Display the login form inside a card -->
    <div class="card shirt-card mx-auto mt-4" style="max-width: 600px;">

        <!-- Page heading -->
        <div class="card-header shirt-card-header">
            <h1 class="h3">Login</h1>
        </div>

        <div class="card-body p-4">

            <!-- Allow existing users to log in -->
            <form method="POST">
                {% csrf_token %}

                <!-- Display the login fields -->
                {{ form.as_p }}

                <!-- Submit the login form -->
                <button type="submit" class="btn btn-comment">
                    Login
                </button>
            </form>

        </div>
    </div>

{% endblock %}
